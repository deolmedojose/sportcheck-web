<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada · SportCheck</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B2545;
    --navy-deep: #071A33;
    --green: #5FA627;
    --white: #FFFFFF;
    --white-70: rgba(255,255,255,0.72);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy-deep);
    color: var(--white);
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 440px; }
  .code {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800;
    font-size: clamp(72px, 18vw, 120px);
    line-height: 1;
    margin: 0 0 8px;
    color: var(--white);
  }
  .code .accent { color: var(--green); }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--white-70);
    margin: 0 0 28px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 24px;
    border-radius: 4px;
    background: var(--green);
    color: var(--navy-deep);
    font-weight: 700;
    font-size: 14.5px;
    text-decoration: none;
  }
  .btn:hover { opacity: 0.92; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">4<span class="accent">0</span>4</p>
    <h1>Esta página no existe</h1>
    <p>El enlace puede estar roto o la página se ha movido. Vuelve al inicio para encontrar lo que buscas.</p>
    <a class="btn" href="/">Ir al inicio</a>
  </div>
</body>
</html>
